name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      FRONTEND_LAB_DATA_DIR: ${{ github.workspace }}/.local/ci-data
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Use canonical temporary paths
        run: |
          $taskTemp = node -p "require('node:fs').realpathSync.native(process.env.RUNNER_TEMP)"
          "TEMP=$taskTemp" >> $env:GITHUB_ENV
          "TMP=$taskTemp" >> $env:GITHUB_ENV
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npx playwright install chromium
      - run: npm run check:all
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            artifacts/playwright/report
            artifacts/playwright/results
          retention-days: 7
          if-no-files-found: ignore
